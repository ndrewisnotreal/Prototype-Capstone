# Postgres lokal untuk development: `docker compose up -d db`
# Penampung email dev (opsional): `docker compose up -d mailpit`, lalu di apps/api/.env SMTP_HOST=localhost, SMTP_PORT=1025.
# Email terkirim terlihat di http://localhost:8025
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ssb
      POSTGRES_PASSWORD: ssb
      POSTGRES_DB: ssb
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  db-data:
